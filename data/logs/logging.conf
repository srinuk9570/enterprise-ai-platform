[loggers]
keys=root,app,access,error

[handlers]
keys=consoleHandler,fileHandler,errorFileHandler,accessFileHandler,jsonHandler

[formatters]
keys=simpleFormatter,detailedFormatter,jsonFormatter,accessFormatter

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler,errorFileHandler

[logger_app]
level=DEBUG
handlers=fileHandler,jsonHandler
qualname=src
propagate=0

[logger_access]
level=INFO
handlers=accessFileHandler
qualname=access
propagate=0

[logger_error]
level=ERROR
handlers=errorFileHandler
qualname=error
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=detailedFormatter
args=('data/logs/app.log', 'a', 10485760, 10)

[handler_errorFileHandler]
class=handlers.RotatingFileHandler
level=ERROR
formatter=detailedFormatter
args=('data/logs/error.log', 'a', 10485760, 5)

[handler_accessFileHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=accessFormatter
args=('data/logs/access.log', 'a', 10485760, 5)

[handler_jsonHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=jsonFormatter
args=('data/logs/structured.log', 'a', 10485760, 5)

[formatter_simpleFormatter]
format=%(asctime)s | %(levelname)-8s | %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_detailedFormatter]
format=%(asctime)s | %(levelname)-8s | %(name)s:%(lineno)d | %(funcName)s | %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_jsonFormatter]
class=src.infrastructure.logging.logger_factory.JsonFormatter

[formatter_accessFormatter]
format=%(message)s